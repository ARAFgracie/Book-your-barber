<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Login</title>
<style>
:root{--primary:#8b5e5a;--secondary:#f8eee9;--text:#2c2524;--muted:#786e6a;--line:#eaded9;--bg1:#fff8f5;--bg2:#efe0db}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
body{min-height:100vh;background:radial-gradient(circle at 15% 15%,#ffffff 0 15%,transparent 38%),radial-gradient(circle at 85% 85%,var(--secondary) 0 12%,transparent 40%),linear-gradient(135deg,var(--bg1),var(--bg2));display:grid;place-items:center;padding:18px;overflow-x:hidden}
.shell{width:min(480px,100%)}
.brand{text-align:center;margin-bottom:18px}.brand img{width:62px;height:62px;border-radius:20px;object-fit:cover;margin-bottom:10px;box-shadow:0 12px 35px #00000018}.brand h1{font-size:22px;margin:0}.brand p{margin:6px 0 0;color:var(--muted);font-size:14px}
.glass{border:1px solid #ffffffaa;background:#ffffffb8;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 25px 70px #3f292514,0 5px 20px #0000000a;border-radius:22px}
.card{padding:24px}.step{transition:opacity .25s ease,transform .25s ease}.step.hidden{display:none}.step h2{margin:0 0 6px;font-size:26px;letter-spacing:-.02em}.step-sub{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.55}
.form{display:grid;gap:14px}.field{display:grid;gap:7px}.field label{font-size:13px;font-weight:700}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;background:#ffffffcc;color:var(--text);outline:none;min-height:46px}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 14%,transparent)}
.btn{min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-weight:700;transition:transform .2s,opacity .2s,box-shadow .2s}.btn:active{transform:scale(.985)}.btn-primary{background:var(--primary);color:#fff;box-shadow:0 10px 22px color-mix(in srgb,var(--primary) 25%,transparent)}.btn-light{background:#fff;color:var(--text);border:1px solid var(--line)}.btn:disabled{opacity:.6;cursor:not-allowed}.back{border:0;background:none;color:var(--muted);padding:8px 0;text-align:left;font-weight:600}.msg{padding:12px 13px;border-radius:13px;margin-top:14px;background:#fff1ee;color:#a52c24;font-size:14px}.msg.ok{background:#eef9f1;color:#26703a}.fine{margin:16px 2px 0;color:var(--muted);font-size:12px;text-align:center}
@media(min-width:700px){.card{padding:30px}.step h2{font-size:30px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://kjxwvstybvkzquuridzv.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_PHYL8XtAgJt3VAEVijHHfg_O4O4cPgZ";
window.sbClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const TIMEOUT_MS=8000;
const SESSION_KEY="salon_session";

async function withTimeout(promise,label="Request"){
  let timer;
  try{return await Promise.race([promise,new Promise((_,reject)=>timer=setTimeout(()=>reject(new Error(label+" timed out")),TIMEOUT_MS))]);}
  finally{clearTimeout(timer)}
}
function readSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||"null")}catch{localStorage.removeItem(SESSION_KEY);return null}}
function saveSession(c){localStorage.setItem(SESSION_KEY,JSON.stringify({id:c.id,name:c.name,phone:c.phone,logged_in_at:new Date().toISOString()}))}
function clearSession(){localStorage.removeItem(SESSION_KEY)}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function niceName(v){return String(v||"").trim().toLowerCase().replace(/\s+/g," ").replace(/(^|\s)\S/g,m=>m.toUpperCase())}
function validPhone(v){return /^01\d{9}$/.test(v)}
function setMsg(text,type=""){const e=document.getElementById("msg");e.textContent=text;e.className="msg "+type;e.hidden=!text}
async function loadSiteSettings(){
  const r=await withTimeout(window.sbClient.from("site_settings").select("*").limit(1).maybeSingle(),"Site settings");
  if(r.error)throw r.error;
  if(r.data)applySiteSettings(r.data);
  return r.data;
}
function applySiteSettings(s){
  document.documentElement.style.setProperty("--primary",s.primary_color||"#8b5e5a");
  document.documentElement.style.setProperty("--secondary",s.secondary_color||"#f8eee9");
  const font=s.font_choice||"Inter";
  const old=document.getElementById("site-font");if(old)old.remove();
  const link=document.createElement("link");link.id="site-font";link.rel="stylesheet";link.href="https://fonts.googleapis.com/css2?family="+encodeURIComponent(font).replace(/%20/g,"+")+":wght@400;500;600;700&display=swap";document.head.appendChild(link);
  document.body.style.fontFamily="'"+font+"',system-ui,sans-serif";
  const brand=s.brand_name||"My Salon";
  document.title=brand+" — Login";
  const b=document.querySelector("[data-brand]");if(b)b.textContent=brand;
  const sl=document.querySelector("[data-slogan]");if(sl)sl.textContent=s.slogan||"";
  if(s.logo_url){const img=document.querySelector("[data-logo]");if(img){img.src=s.logo_url;img.hidden=false}}
  if(s.favicon_url){let f=document.querySelector('link[rel="icon"]');if(!f){f=document.createElement("link");f.rel="icon";document.head.appendChild(f)}f.href=s.favicon_url}
  if(s.custom_css){const st=document.createElement("style");st.id="custom-site-css";st.textContent=s.custom_css;document.head.appendChild(st)}
  if(s.custom_html){const h=document.getElementById("custom-site-html");if(h)h.innerHTML=s.custom_html}
}

/* In this MVP phone identity is the customer login; Supabase Auth is not used for customer accounts. */
(async function boot(){
  const s=readSession();
  if(s&&s.id&&s.name&&s.phone){
    try{
      const r=await withTimeout(window.sbClient.rpc("find_customer_by_phone",{p_phone:s.phone}),"Session validation");
      if(!r.error&&Array.isArray(r.data)&&r.data[0]&&r.data[0].id===s.id){window.location.replace("index.html");return}
    }catch(e){/* stay on login if validation cannot complete */}
  }
  clearSession();
  try{await loadSiteSettings()}catch(e){console.warn(e)}
  document.documentElement.classList.add("ready");
})();
</script>
</head>
<body>
<main class="shell">
  <header class="brand"><img data-logo hidden alt=""><h1 data-brand>My Salon</h1><p data-slogan>Book your appointment with ease.</p></header>
  <section class="glass card">
    <div id="step1" class="step">
      <h2>Welcome</h2><p class="step-sub">Enter your Bangladeshi phone number to continue.</p>
      <form id="phone-form" class="form" novalidate>
        <div class="field"><label for="phone">Phone Number</label><input id="phone" name="phone" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="01XXXXXXXXX" required></div>
        <button id="phone-btn" class="btn btn-primary" type="submit">Continue</button>
      </form>
    </div>
    <div id="step2" class="step hidden">
      <h2>Create your account</h2><p class="step-sub">We only need these details once. Your phone number is already saved.</p>
      <form id="details-form" class="form" novalidate>
        <div class="field"><label for="name">Name</label><input id="name" autocomplete="name" maxlength="80" required></div>
        <div class="field"><label for="age">Age</label><input id="age" type="number" min="5" max="100" inputmode="numeric" required></div>
        <div class="field"><label for="address">Address</label><textarea id="address" autocomplete="street-address" maxlength="250" required></textarea></div>
        <button id="create-btn" class="btn btn-primary" type="submit">Create Account &amp; Continue</button>
        <button id="back-btn" class="back" type="button">← Back</button>
      </form>
    </div>
    <div id="msg" class="msg" hidden></div>
  </section>
  <p class="fine">No OTP or password required for this MVP.</p>
</main>
<div id="custom-site-html"></div>
<script>
let pendingPhone="";
function setLoading(btn,on,label){btn.disabled=on;if(on){btn.dataset.original=btn.textContent;btn.textContent=label}else btn.textContent=btn.dataset.original||btn.textContent}
function showStep2(){document.getElementById("step1").classList.add("hidden");document.getElementById("step2").classList.remove("hidden");setMsg("");document.getElementById("name").focus()}
function showStep1(){document.getElementById("step2").classList.add("hidden");document.getElementById("step1").classList.remove("hidden");setMsg("");document.getElementById("phone").focus()}

document.getElementById("phone-form").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=document.getElementById("phone-btn");
  const phone=document.getElementById("phone").value.replace(/\D/g,"");
  document.getElementById("phone").value=phone;
  if(!validPhone(phone)){setMsg("Enter a valid Bangladeshi number like 01XXXXXXXXX.","error");return}
  pendingPhone=phone;setLoading(btn,true,"Checking...");setMsg("");
  try{
    const r=await withTimeout(window.sbClient.rpc("find_customer_by_phone",{p_phone:phone}),"Customer lookup");
    if(r.error)throw r.error;
    const customer=Array.isArray(r.data)?r.data[0]:r.data;
    if(customer){saveSession(customer);window.location.replace("index.html");return}
    showStep2();
  }catch(err){setMsg(err.message||"Could not check your phone number.","error")}
  finally{setLoading(btn,false,"Checking...")}
});

document.getElementById("back-btn").addEventListener("click",showStep1);

document.getElementById("details-form").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=document.getElementById("create-btn");
  const name=document.getElementById("name").value.trim();
  const age=Number(document.getElementById("age").value);
  const address=document.getElementById("address").value.trim();
  if(!name){setMsg("Please enter your name.","error");return}
  if(!Number.isInteger(age)||age<5||age>100){setMsg("Please enter an age between 5 and 100.","error");return}
  if(!address){setMsg("Please enter your address.","error");return}
  setLoading(btn,true,"Creating...");setMsg("");
  try{
    const ins=await withTimeout(window.sbClient.rpc("create_customer",{
      p_name:name,
      p_phone:pendingPhone,
      p_age:age,
      p_address:address
    }),"Account creation");
    if(ins.error){
      if(ins.error.code==="23505"){
        const existing=await withTimeout(window.sbClient.rpc("find_customer_by_phone",{p_phone:pendingPhone}),"Customer lookup");
        if(existing.error)throw existing.error;
        const c=Array.isArray(existing.data)?existing.data[0]:existing.data;
        if(c){saveSession(c);window.location.replace("index.html");return}
      }
      throw ins.error;
    }
    const created=Array.isArray(ins.data)?ins.data[0]:ins.data;
    if(!created)throw new Error("Account was not created.");
    saveSession(created);window.location.replace("index.html");
  }catch(err){setMsg(err.message||"Could not create your account.","error")}
  finally{setLoading(btn,false,"Creating...")}
});
</script>
</body>
</html>
