<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Salon</title>
<style>
:root{--primary:#8b5e5a;--secondary:#f8eee9;--bg:#fffaf8;--text:#2c2524;--muted:#786e6a;--line:#eaded9}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 12% 8%,#fff 0 12%,transparent 35%),radial-gradient(circle at 90% 80%,var(--secondary) 0 10%,transparent 38%),linear-gradient(135deg,var(--bg),#f4e9e4);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;padding-bottom:82px}
body:not(.ready){visibility:hidden}.container{width:min(1120px,calc(100% - 28px));margin:auto}.top{padding:18px 0}.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}.brand img{width:40px;height:40px;object-fit:cover;border-radius:12px}.glass{border:1px solid #ffffffb5;background:#ffffffa8;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 16px 45px #3f292514,0 2px 10px #00000008}.hero{margin:10px 0 26px;padding:28px 22px;border-radius:24px}.hero h1{font-size:clamp(30px,8vw,58px);line-height:1.02;margin:9px 0 12px;letter-spacing:-.035em;max-width:900px}.hero p{color:var(--muted);max-width:700px;line-height:1.6}.hero-logo{width:58px;height:58px;object-fit:cover;border-radius:18px;display:none;margin-bottom:8px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;border:0;border-radius:14px;padding:12px 18px;font-weight:700;transition:transform .2s,opacity .2s,box-shadow .2s}.btn:active{transform:scale(.985)}.btn-primary{background:var(--primary);color:#fff;box-shadow:0 10px 22px color-mix(in srgb,var(--primary) 24%,transparent)}.btn-light{background:#fff;color:var(--text);border:1px solid var(--line)}.btn:disabled{opacity:.55}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:24px 0 12px}.section-head h2{font-size:21px;margin:0}.muted{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#ffffffaa;border:1px solid #ffffffaa;border-radius:20px;padding:16px}.service-card h3{margin:0 0 7px;font-size:16px}.price{font-weight:800;margin:12px 0}.service-card .row{display:flex;justify-content:space-between;align-items:end;gap:8px}.list-view{grid-template-columns:1fr!important}.empty{text-align:center;padding:38px 15px;color:var(--muted);grid-column:1/-1}.session-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}.session-user{font-size:13px;color:var(--muted)}.bottom-nav{position:fixed;z-index:20;left:0;right:0;bottom:0;padding:9px max(10px,env(safe-area-inset-right)) max(9px,env(safe-area-inset-bottom));background:#ffffffdf;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}.bottom-nav a{text-align:center;font-size:12px;color:var(--muted);padding:5px;min-height:44px}.bottom-nav a.active{color:var(--primary);font-weight:700}.msg{padding:12px 14px;border-radius:14px;margin:12px 0;background:#fff1ee;color:#a52c24}.two-col{display:grid;gap:12px}@media(min-width:700px){body{padding-bottom:24px}.bottom-nav{position:static;width:min(760px,calc(100% - 28px));margin:30px auto 0;border:1px solid var(--line);border-radius:20px}.grid{grid-template-columns:repeat(3,1fr)}.two-col{grid-template-columns:1.3fr .7fr}.hero{padding:44px 48px}.hero h1{font-size:clamp(42px,5vw,66px)}}@media(min-width:1024px){.top{padding:26px 0}.grid{grid-template-columns:repeat(4,1fr)}.hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:40px}.hero-copy{max-width:800px}.hero-logo{display:block;width:110px;height:110px;border-radius:28px}.bottom-nav{margin-top:30px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://kjxwvstybvkzquuridzv.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_PHYL8XtAgJt3VAEVijHHfg_O4O4cPgZ";
window.sbClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const TIMEOUT_MS=8000,SESSION_KEY="salon_session";
function readSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||"null")}catch{localStorage.removeItem(SESSION_KEY);return null}}
function clearSession(){localStorage.removeItem(SESSION_KEY)}
async function withTimeout(promise,label="Request"){let timer;try{return await Promise.race([promise,new Promise((_,reject)=>timer=setTimeout(()=>reject(new Error(label+" timed out")),TIMEOUT_MS))])}finally{clearTimeout(timer)}}
async function getUser(){const s=readSession();return (s&&s.id&&s.name&&s.phone)?s:null}
function niceName(v){return String(v||"").trim().toLowerCase().replace(/\s+/g," ").replace(/(^|\s)\S/g,m=>m.toUpperCase())}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]) )}
function money(v){return "৳"+Number(v).toLocaleString("en-BD")}
function go(path){window.location.replace(path)}
async function loadSiteSettings(){const r=await withTimeout(window.sbClient.from("site_settings").select("*").limit(1).maybeSingle(),"Site settings");if(r.error)throw r.error;if(r.data)applySiteSettings(r.data);return r.data}
function applySiteSettings(s){
  document.documentElement.style.setProperty("--primary",s.primary_color||"#8b5e5a");document.documentElement.style.setProperty("--secondary",s.secondary_color||"#f8eee9");
  const font=s.font_choice||"Inter";const old=document.getElementById("site-font");if(old)old.remove();const link=document.createElement("link");link.id="site-font";link.rel="stylesheet";link.href="https://fonts.googleapis.com/css2?family="+encodeURIComponent(font).replace(/%20/g,"+")+":wght@400;500;600;700&display=swap";document.head.appendChild(link);document.body.style.fontFamily="'"+font+"',system-ui,sans-serif";
  document.title=(s.brand_name||"My Salon");document.querySelectorAll("[data-brand]").forEach(e=>e.textContent=s.brand_name||"My Salon");document.querySelectorAll("[data-slogan]").forEach(e=>e.textContent=s.slogan||"");document.querySelectorAll("[data-hero-heading]").forEach(e=>e.textContent=s.hero_heading||"Book Your Appointment");document.querySelectorAll("[data-hero-subtext]").forEach(e=>e.textContent=s.hero_subtext||"");document.querySelectorAll("[data-book-label]").forEach(e=>e.textContent=s.book_button_label||"Book Now");
  document.querySelectorAll("[data-layout]").forEach(e=>e.classList.toggle("list-view",s.service_layout==="list"));
  if(s.logo_url){document.querySelectorAll("[data-logo]").forEach(e=>{e.src=s.logo_url;e.style.display="block"})}if(s.favicon_url){let f=document.querySelector('link[rel="icon"]');if(!f){f=document.createElement("link");f.rel="icon";document.head.appendChild(f)}f.href=s.favicon_url}
  if(s.custom_css){let st=document.getElementById("custom-site-css");if(!st){st=document.createElement("style");st.id="custom-site-css";document.head.appendChild(st)}st.textContent=s.custom_css}if(s.custom_html){const h=document.getElementById("custom-site-html");if(h)h.innerHTML=s.custom_html}
}
/* Guard runs before protected content is made visible. */
(async function guard(){
  const s=await getUser();
  if(!s){clearSession();go("login.html");return}
  try{
    const r=await withTimeout(window.sbClient.rpc("find_customer_by_phone",{p_phone:s.phone}),"Session validation");
    const c=Array.isArray(r.data)?r.data[0]:r.data;
    if(r.error||!c||c.id!==s.id){clearSession();go("login.html");return}
    document.documentElement.classList.add("session-valid");
  }catch(e){clearSession();go("login.html");return}
})();
</script>
</head>
<body>
<main id="app" class="container">
<header class="top"><a class="brand" href="index.html"><img data-logo hidden alt=""><span data-brand>My Salon</span></a></header>
<section class="session-bar"><span id="session-user" class="session-user"></span><button id="logout" class="btn btn-light" type="button">Log out</button></section>
<section class="hero glass">
  <div class="hero-copy"><span class="muted" data-slogan></span><h1 id="greeting">Hi, Book Your Schedule</h1><p data-hero-subtext>Beautiful services, simple booking.</p><a class="btn btn-primary" href="services.html" data-book-label>Book Now</a></div>
  <img class="hero-logo" data-logo hidden alt="Salon logo">
</section>
<div class="section-head"><h2>Popular services</h2><a class="muted" href="services.html">See all</a></div>
<div id="services" class="grid" data-layout></div>
<div id="msg" class="msg" hidden></div>
</main>
<nav class="bottom-nav"><a class="active" href="index.html">⌂<br>Home</a><a href="services.html">✦<br>Services</a><a href="my-bookings.html">▣<br>My Bookings</a><a href="#profile" id="profile-link">◉<br>Profile</a></nav>
<div id="profile-modal" hidden style="position:fixed;inset:0;z-index:50;background:#00000055;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:18px;place-items:center"><section class="glass" style="width:min(430px,100%);padding:22px;border-radius:22px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0">Profile</h2><button id="close-profile" class="btn btn-light" type="button">Close</button></div><div style="margin-top:18px;display:grid;gap:10px"><div><span class="muted">Name</span><div id="profile-name" style="font-weight:700"></div></div><div><span class="muted">Phone</span><div id="profile-phone" style="font-weight:700"></div></div><div><span class="muted">Logged in</span><div id="profile-time" class="muted"></div></div></div></section></div>
<div id="custom-site-html"></div>
<script>
(async function init(){
  const session=readSession();
  if(!session||!session.id||!session.name||!session.phone)return;
  document.getElementById("session-user").textContent="Logged in as "+niceName(session.name);
  document.getElementById("logout").onclick=()=>{clearSession();window.location.replace("login.html")};
  const profileModal=document.getElementById("profile-modal");
  document.getElementById("profile-link").onclick=e=>{e.preventDefault();document.getElementById("profile-name").textContent=niceName(session.name);document.getElementById("profile-phone").textContent=session.phone;document.getElementById("profile-time").textContent=session.logged_in_at?new Date(session.logged_in_at).toLocaleString():"—";profileModal.hidden=false;profileModal.style.display="grid"};
  document.getElementById("close-profile").onclick=()=>{profileModal.hidden=true;profileModal.style.display="none"};
  profileModal.addEventListener("click",e=>{if(e.target===profileModal){profileModal.hidden=true;profileModal.style.display="none"}});
  try{await loadSiteSettings()}catch(e){console.warn(e)}
  const settings=await (async()=>{try{return await loadSiteSettings()}catch{return null}})();
  const brand=(settings&&settings.brand_name)||"My Salon";
  document.getElementById("greeting").textContent=`Hi ${niceName(session.name)}, Book Your Schedule with ${brand}`;
  try{
    const r=await withTimeout(window.sbClient.from("services").select("id,name,price,duration_minutes").eq("is_active",true).order("created_at").limit(8),"Services");
    if(r.error)throw r.error;
    document.getElementById("services").innerHTML=(r.data||[]).map(s=>`<article class="card service-card"><h3>${esc(s.name)}</h3><div class="muted">${s.duration_minutes} min</div><div class="row"><div class="price">${money(s.price)}</div><a class="btn btn-light" href="booking.html?service=${encodeURIComponent(s.id)}">Select</a></div></article>`).join("")||'<div class="empty">No services available yet.</div>';
  }catch(e){const m=document.getElementById("msg");m.textContent=e.message||"Could not load services.";m.hidden=false}
  document.body.classList.add("ready");
})();
</script>
</body>
</html>
