<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Customer Info</title>
<style>
:root{--primary:#8b5e5a;--secondary:#f8eee9;--bg:#fffaf8;--text:#2c2524;--muted:#786e6a;--line:#eaded9}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;padding-bottom:82px}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}
.container{width:min(1100px,calc(100% - 28px));margin:auto}.top{padding:18px 0}.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}.brand img{width:38px;height:38px;object-fit:cover;border-radius:12px}.hero{margin:10px 0 24px;padding:30px 22px;border-radius:28px;background:linear-gradient(135deg,var(--secondary),#fff);box-shadow:0 12px 35px #5d40370f}.hero h1{font-size:clamp(30px,8vw,56px);line-height:1.02;margin:8px 0 12px}.hero p{color:var(--muted);max-width:650px}.glass{border:1px solid #ffffffaa;background:#ffffffaa;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 30px #0000000d}.btn{border:0;border-radius:16px;padding:13px 18px;font-weight:600;transition:.2s}.btn-primary{background:var(--primary);color:#fff}.btn-light{background:#fff;color:var(--text);border:1px solid var(--line)}.btn:disabled{opacity:.5;cursor:not-allowed}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:24px 0 12px}.section-head h2{font-size:21px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 8px 24px #5d40370a}.service-card h3{margin:0 0 7px;font-size:16px}.muted{color:var(--muted);font-size:14px}.price{font-weight:700;margin:12px 0}.service-card .row{display:flex;justify-content:space-between;align-items:end;gap:8px}.list-view{grid-template-columns:1fr!important}.empty{text-align:center;padding:35px 15px;color:var(--muted)}.msg{padding:12px 14px;border-radius:14px;margin:12px 0;background:#fff1ee}.msg.error{color:#a52c24}.msg.ok{background:#eef9f1;color:#26703a}.form{display:grid;gap:13px}.field{display:grid;gap:7px}.field label{font-weight:600;font-size:14px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 13px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 15%,transparent)}.dates{display:flex;gap:8px;overflow:auto;padding:3px 1px 10px}.date-btn{min-width:72px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:10px 7px;text-align:center}.date-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 5px}.slot.active{background:var(--primary);color:#fff;border-color:var(--primary)}.slot.busy{background:#eee;color:#aaa;text-decoration:line-through;cursor:not-allowed}.summary{display:grid;gap:8px}.summary-row{display:flex;justify-content:space-between;gap:15px}.booking-item{display:grid;gap:8px}.status{display:inline-flex;padding:5px 9px;border-radius:99px;font-size:12px;background:#eee;justify-self:start}.status.confirmed{background:#e9f6ec;color:#24733b}.status.cancelled{background:#fcebea;color:#a32925}.status.completed{background:#eee9fb;color:#5d43a4}.bottom-nav{position:fixed;z-index:20;left:0;right:0;bottom:0;padding:9px max(10px,env(safe-area-inset-right)) max(9px,env(safe-area-inset-bottom));background:#ffffffdd;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}.bottom-nav a{text-align:center;font-size:12px;color:var(--muted);padding:5px}.bottom-nav a.active{color:var(--primary);font-weight:700}.admin-layout{display:grid;gap:14px}.admin-tabs{display:flex;gap:7px;overflow:auto}.admin-tabs button{white-space:nowrap}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}.danger{background:#b33b35!important;color:#fff}.preview{width:100%;height:500px;border:1px solid var(--line);border-radius:16px;background:#fff}.two{display:grid;gap:10px}@media(min-width:700px){body{padding-bottom:20px}.bottom-nav{position:static;width:min(700px,calc(100% - 28px));margin:30px auto 0;border:1px solid var(--line);border-radius:20px}.grid{grid-template-columns:repeat(3,1fr)}.slots{grid-template-columns:repeat(5,1fr)}.two{grid-template-columns:1fr 1fr}.admin-layout{grid-template-columns:220px 1fr}.admin-tabs{display:grid;align-content:start}.admin-tabs button{text-align:left}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main class="container"><header class="top"><a class="brand" href="booking.html">← <span data-cart-title>Your Booking</span></a></header>

<section id="summary" class="card"></section>

<!-- STEP 1: Phone -->
<section id="phone-step" class="card" style="margin-top:15px">
  <div class="section-head" style="margin-top:0">
    <h2>Enter your phone</h2>
  </div>
  <p class="muted">Returning customers only need their phone number.</p>
  <form id="phone-form" class="form">
    <div class="field">
      <label>Phone number</label>
      <input id="phone" inputmode="tel" autocomplete="tel"
             placeholder="01XXXXXXXXX" required>
    </div>
    <button class="btn btn-primary" type="submit">Continue</button>
  </form>
</section>

<!-- STEP 2: New customer details -->
<section id="details-step" class="card" style="margin-top:15px" hidden>
  <div class="section-head" style="margin-top:0">
    <h2>Tell us about you</h2>
  </div>
  <p class="muted">We only ask this once. Next time, your phone number is enough.</p>

  <form id="details-form" class="form">
    <div class="field">
      <label>Name</label>
      <input id="name" autocomplete="name" placeholder="Your name" required>
    </div>

    <div class="field">
      <label>Email</label>
      <input id="email" type="email" autocomplete="email"
             placeholder="you@example.com" required>
    </div>

    <div class="field">
      <label>What do you do?</label>
      <select id="occupation" required>
        <option value="">Select one</option>
        <option value="student">Student</option>
        <option value="job">Job</option>
        <option value="business">Business</option>
      </select>
    </div>

    <button class="btn btn-primary" type="submit" data-confirm-label>
      Confirm & Book
    </button>
  </form>
</section>

<div id="msg" class="msg" hidden></div></main>
<nav class="bottom-nav">
<a href="index.html">⌂<br>Home</a>
<a href="services.html">✦<br>Services</a>
<a href="my-bookings.html">▣<br>My Bookings</a>
<a href="customer-info.html">◉<br>Profile</a>
</nav>
<div id="custom-site-html"></div>
<script>
(async()=>{try{await loadSiteSettings();}catch(e){console.warn(e);} const draft = getBookingDraft();
let existing = null;

if (!draft) {
  setMsg("Booking selection expired. Please choose a service again.", "error");
  document.getElementById("phone-step").hidden = true;
} else {
  document.getElementById("summary").innerHTML = `
    <div class="summary">
      <div class="muted">Your booking</div>
      <b>${esc(draft.serviceName)}</b>
      <span>${esc(draft.date)} · ${esc(draft.time)}</span>
      <strong>${money(draft.price)}</strong>
    </div>`;
}

/* STEP 1 — phone only */
document.getElementById("phone-form").onsubmit = async (e) => {
  e.preventDefault();

  const phone = document.getElementById("phone").value.trim();
  if (!phone) {
    setMsg("Phone number is required.", "error");
    return;
  }

  try {
    const r = await withTimeout(
      sb.from("customers")
        .select("id,name,phone,email,occupation")
        .eq("phone", phone)
        .maybeSingle(),
      "Customer lookup"
    );

    if (r.error) throw r.error;

    existing = r.data;

    if (existing) {
      /*
       * OLD CUSTOMER:
       * No second form. Phone is enough.
       */
      setMsg(`Welcome back, ${existing.name}. Confirming your booking...`, "ok");
      await createBooking(existing.id);
    } else {
      /*
       * NEW CUSTOMER:
       * Show second form: name + email + occupation.
       */
      document.getElementById("phone-step").hidden = true;
      document.getElementById("details-step").hidden = false;
      setMsg("New customer. Please complete your details.", "");
      document.getElementById("name").focus();
    }
  } catch (err) {
    setMsg(err.message || "Could not check your phone number.", "error");
  }
};

/* STEP 2 — new customer details */
document.getElementById("details-form").onsubmit = async (e) => {
  e.preventDefault();

  const phone = document.getElementById("phone").value.trim();
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const occupation = document.getElementById("occupation").value;

  if (!name || !email || !occupation) {
    setMsg("Please complete all fields.", "error");
    return;
  }

  try {
    const r = await withTimeout(
      sb.from("customers")
        .insert({
          name,
          phone,
          email,
          occupation
        })
        .select("id")
        .single(),
      "Customer creation"
    );

    if (r.error) throw r.error;

    await createBooking(r.data.id);
  } catch (err) {
    setMsg(err.message || "Could not create your profile.", "error");
  }
};

/* Shared booking creation */
async function createBooking(customerId) {
  if (!draft) throw new Error("Booking selection expired.");

  /*
   * Re-check availability immediately before insert.
   * This is still important even though the booking page already
   * showed the slot as available.
   */
  const check = await withTimeout(
    sb.from("bookings")
      .select("id,booking_time")
      .eq("booking_date", draft.date)
      .eq("status", "confirmed"),
    "Availability check"
  );

  if (check.error) throw check.error;

  const taken = check.data.some((x) => {
    const [h, m] = String(x.booking_time).slice(0, 5).split(":").map(Number);
    const bookedStart = h * 60 + m;
    const selectedStart = Number(draft.timeMinutes);

    return (
      selectedStart < bookedStart + Number(draft.duration) &&
      selectedStart + Number(draft.duration) > bookedStart
    );
  });

  if (taken) {
    throw new Error("That slot was just booked. Please choose another time.");
  }

  const h = Math.floor(Number(draft.timeMinutes) / 60);
  const m = Number(draft.timeMinutes) % 60;

  const r = await withTimeout(
    sb.from("bookings")
      .insert({
        customer_id: customerId,
        service_id: draft.serviceId,
        booking_date: draft.date,
        booking_time:
          `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:00`,
        status: "confirmed"
      })
      .select("id")
      .single(),
    "Booking creation"
  );

  if (r.error) {
    /*
     * If the DB unique index catches a race, show a friendly message.
     */
    if (r.error.code === "23505") {
      throw new Error("That slot was just booked. Please choose another time.");
    }
    throw r.error;
  }

  sessionStorage.setItem(
    "last_booking",
    JSON.stringify({
      ...draft,
      bookingId: r.data.id,
      customerId
    })
  );

  clearBookingDraft();
  go("confirmation.html");
}})();
</script>
</body>
</html>
